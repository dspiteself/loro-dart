[toolchain]
# native_toolchain_rust requires an exact version for reproducible builds.
channel = "1.90.0"
targets = [
  # Android
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",
  # iOS (device + simulator)
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  # Windows
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  # Linux
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
# The web build (tool/build_web.sh) adds wasm32-unknown-emscripten itself, so
# consumers of the package do not download it.
