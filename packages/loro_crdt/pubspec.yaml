name: loro_crdt
description: >-
  Dart bindings for Loro, a high-performance CRDT library for local-first,
  collaborative apps. Runs on Android, iOS, macOS, Windows, Linux and the web.
version: 0.1.0
repository: https://github.com/dspiteself/loro-dart/tree/main/packages/loro_crdt
issue_tracker: https://github.com/dspiteself/loro-dart/issues
topics: [crdt, local-first, collaboration, ffi, wasm]

environment:
  sdk: ^3.10.8

resolution: workspace

dependencies:
  code_assets: ^2.1.0
  hooks: ^2.2.0
  meta: ^1.17.0
  native_toolchain_rust: ^1.0.7
  wasm_ffi: ^2.4.0

dev_dependencies:
  web: ^1.1.1
  lints: ^6.0.0
  test: ^1.26.0
